name: Publish to MCP Registry

on:
  push:
    tags: ["v*"] # e.g. v1.0.0 — must match "version" in server.json

env:
  # Pinned mcp-publisher release (linux_amd64). Update both values together, in validate.yml too.
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login, grants the io.github.Chatway-app/* namespace
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check tag matches server.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(jq -r .version server.json)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server.json version $FILE_VERSION"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify listing
        run: |
          NAME="$(jq -r .name server.json)"
          VERSION="$(jq -r .version server.json)"
          RESULT="$(curl -fsS --max-time 60 --retry 3 "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}&version=${VERSION}")"
          echo "$RESULT" | jq .
          echo "$RESULT" | jq -e --arg n "$NAME" --arg v "$VERSION" \
            '[.servers[].server | select(.name == $n and .version == $v)] | length > 0' > /dev/null \
            || { echo "Published $NAME@$VERSION not found in the registry"; exit 1; }
