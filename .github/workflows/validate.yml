name: Validate manifests

on:
  pull_request:
  push:
    branches: [main]

env:
  # Keep in sync with publish-mcp.yml
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

  gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate gemini-extension.json
        run: |
          jq -e '
            (.name | test("^[a-z0-9-]+$")) and
            (.version | type == "string" and length > 0) and
            (.description | type == "string" and length > 0) and
            (.mcpServers.chatway.httpUrl == "https://mcp.chatway.app/mcp")
          ' gemini-extension.json > /dev/null \
            || { echo "gemini-extension.json is missing required fields or the production endpoint"; exit 1; }

          CONTEXT_FILE="$(jq -r '.contextFileName // empty' gemini-extension.json)"
          if [ -n "$CONTEXT_FILE" ] && [ ! -f "$CONTEXT_FILE" ]; then
            echo "contextFileName $CONTEXT_FILE does not exist"
            exit 1
          fi

  cursor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate .cursor-plugin/plugin.json
        run: |
          MANIFEST=.cursor-plugin/plugin.json
          jq -e '
            (.name | test("^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$")) and
            (.description | type == "string" and length > 0) and
            (.mcpServers.chatway.url == "https://mcp.chatway.app/mcp")
          ' "$MANIFEST" > /dev/null \
            || { echo "$MANIFEST is missing required fields or the production endpoint"; exit 1; }

          LOGO="$(jq -r '.logo // empty' "$MANIFEST")"
          case "$LOGO" in /*|*..*) echo "logo path must be relative without .."; exit 1;; esac
          if [ -n "$LOGO" ] && [ ! -f "$LOGO" ]; then echo "logo $LOGO does not exist"; exit 1; fi

          for rule in rules/*.mdc; do
            head -1 "$rule" | grep -q '^---$' || { echo "$rule is missing frontmatter"; exit 1; }
            grep -q '^description:' "$rule" || { echo "$rule is missing a description"; exit 1; }
          done
